name: FDT CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fdt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      FDT_OLLAMA_URL: http://127.0.0.1:1
      FDT_TURN_LOG_DIR: log/turns
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Build distribution
        run: uv build
      - name: Run Python tests without Ollama
        run: uv run --locked --extra dev pytest -q --junitxml=test-results/pytest.xml
      - name: Run JavaScript regression tests
        shell: bash
        run: |
          if compgen -G 'tests/js/*.test.cjs' > /dev/null; then
            node --test tests/js/*.test.cjs
          fi
      - name: Smoke test installed wheel
        shell: bash
        run: |
          uv pip install --python .venv/bin/python --no-deps --reinstall dist/*.whl
          .venv/bin/python -I -c "from fdt.web import BASE_DIR, SEED_DIR, _profile_ids, _build_context; assert SEED_DIR == BASE_DIR / 'demo' / 'seed'; assert (BASE_DIR / 'static' / 'index.html').is_file(); assert len(_profile_ids()) == 3; ctx, risk, room = _build_context('A_steady'); assert ctx.state.liquidity >= 0; print('Installed wheel: profiles, ledger, state, risk, static resources OK')"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdt-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdt-distributions
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
