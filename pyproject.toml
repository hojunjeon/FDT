[project]
name = "fdt"
version = "0.1.0"
description = "KeyFin 개인 금융 디지털 트윈(PFDT) 코어와 분석·코칭 에이전트"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
    # FDT-WEB-01: 정적 대시보드와 코어 JSON을 제공하는 로컬 HTTP 어댑터
    "fastapi>=0.115",
    # FDT-WEB-01: FastAPI 로컬 대시보드 서버 실행기
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fdt = "fdt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel.force-include]
"data/seed" = "fdt/demo/seed"
