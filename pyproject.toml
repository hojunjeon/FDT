[project]
name = "fdt"
version = "0.1.0"
description = "KeyFin 개인 금융 디지털 트윈(PFDT) 코어와 분석·코칭 에이전트"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fdt = "fdt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
